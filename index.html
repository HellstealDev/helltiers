<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard System</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        .container {
            margin: 20px;
        }
        .leaderboard {
            width: 100%;
            border-collapse: collapse;
        }
        .leaderboard th, .leaderboard td {
            border: 1px solid #ffffff;
            padding: 10px;
            text-align: left;
        }
        .button {
            background-color: #6200EE;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 5px;
        }
        .admin-panel {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Leaderboard System</h1>
        <h2>Player Management</h2>
        <table class="leaderboard">
            <tr>
                <th>Player Name</th>
                <th>Score</th>
                <th>Game Mode</th>
            </tr>
            <tr>
                <td>Alice</td>
                <td>1500</td>
                <td>Cart</td>
            </tr>
            <tr>
                <td>Bob</td>
                <td>1800</td>
                <td>Sword</td>
            </tr>
            <tr>
                <td>Charlie</td>
                <td>1200</td>
                <td>Mace</td>
            </tr>
            <tr>
                <td>Dave</td>
                <td>2000</td>
                <td>DiaPoT</td>
            </tr>
        </table>
        <div class="admin-panel">
            <h3>Admin Panel</h3>
            <button class="button">Add Player</button>
            <button class="button">Remove Player</button>
            <button class="button">Update Score</button>
        </div>
    </div>
</body>
</html>
